<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Mi cuenta - PokéStore</title>

    <link rel="stylesheet" href="CSS/mi-cuenta.css">
</head>

<body>

    <header class="cuenta-header">

        <div class="header-contenedor">

            <div class="logo-tienda">

                <h1>PokéStore ⚪</h1>

                <p>Pokémon para coleccionistas</p>

            </div>

            <a href="index.html" class="volver-tienda">
                Volver a la tienda
            </a>

        </div>

    </header>


    <main class="cuenta-contenedor">


        <section class="bienvenida">

            <h2>Mi cuenta</h2>

            <p>
                Administra tus datos y revisa tus pedidos.
            </p>

        </section>



        <div class="cuenta-grid">


            <!-- MIS DATOS -->

            <section class="cuenta-card">

                <h2>👤 Mis datos</h2>


                <div class="form-group">

                    <label>Nombre</label>

                    <input
                        id="nombre"
                        type="text"
                        placeholder="Nombre">

                </div>


                <div class="form-group">

                    <label>Correo electrónico</label>

                    <input
                        id="email"
                        type="email"
                        placeholder="Correo">

                </div>


                <button
                    id="btn-actualizar"
                    class="btn-actualizar">

                    Actualizar datos

                </button>

            </section>



            <!-- MIS PEDIDOS -->

            <section class="cuenta-card">

                <h2>📦 Mis pedidos</h2>


                <div
                    id="lista-pedidos"
                    class="lista-pedidos">


                    <div class="sin-pedidos">

                        <p>
                            Todavía no tienes pedidos.
                        </p>

                    </div>


                </div>

            </section>


        </div>


        <div class="cerrar-sesion-contenedor">

            <button
                id="btn-cerrar-sesion"
                class="btn-cerrar-sesion">

                Cerrar sesión

            </button>

        </div>


    </main>


    <script src="JS/mi-cuenta.js"></script>

</body>

</html>
