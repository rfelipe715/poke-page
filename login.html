<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión | PokéStore</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main class="acceso-page">
      <a href="index.html" class="acceso-volver">← Volver a la tienda</a>

      <section class="acceso-card">
        <div class="card-decoration">
          <div class="pokeball"><span></span></div>
        </div>

        <div class="acceso-header">
          <h1>PokéStore</h1>
          <p>Inicia sesión para continuar</p>
        </div>

        <p class="mensaje-error" id="mensajeCredenciales"></p>

        <form id="formLogin" novalidate>
          <div class="form-grid">
            <div class="campo">
              <label for="input-email">Correo electrónico</label>
              <input
                id="input-email"
                type="email"
                placeholder="correo@duoc.cl"
                maxlength="100"
              />
              <span class="mensaje-error" id="error-email"></span>
            </div>

            <div class="campo">
              <label for="input-password">Contraseña</label>
              <input
                id="input-password"
                type="password"
                placeholder="Entre 4 y 10 caracteres"
                maxlength="10"
              />
              <span class="mensaje-error" id="error-password"></span>
            </div>

            <div class="acceso-opciones">
              <label class="remember">
                <input type="checkbox" />
                Recordarme
              </label>

              <a href="#" class="forgot">¿Olvidaste tu contraseña?</a>
            </div>

            <button
              id="btn-inicio-sesion"
              type="submit"
              class="btn btn-amarillo btn-ancho"
            >
              INICIAR SESIÓN
            </button>
          </div>
        </form>

        <div class="pie-formulario">
          <p>
            ¿No tienes una cuenta?
            <a href="registro.html">Regístrate</a>
          </p>
        </div>
      </section>
    </main>

    <script src="JS/validaciones.js"></script>
    <script src="JS/inicio-sesion.js"></script>
  </body>
</html>
