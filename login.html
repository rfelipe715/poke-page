<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="CSS/inicio-sesion.css">
</head>

<body>

    <main class="login-container">
        <h1>USER LOGIN</h1>

        <div class="line"></div>

        <div class="input-container">

            <div class="icon user-icon">
                <span></span>
            </div>

            <input id="input-email" type="email" placeholder="Username">

        </div>

        <div class="input-container">

            <div class="icon lock-icon">
                <span></span>
            </div>

            <input id="input-password" type="password" placeholder="Password">

        </div>

        <div class="input-container">

            <div class="icon login-icon">
                <span></span>
            </div>

            <button id="btn-inicio-sesion" type="button">
                LOGIN
            </button>

        </div>

        <a href="#" class="forgot">
            Forgot password?
        </a>

    </main>

    <script src="JS/inicio-sesion.js"></script>

</body>

</html>
