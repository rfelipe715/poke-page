<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | PokeStore</title>

    <link rel="stylesheet" href="CSS/inicio-sesion.css">
</head>

<body>

    <main class="login-page">

        <section class="login-card">

            <div class="card-decoration">
                <div class="pokeball">
                    <span></span>
                </div>
            </div>

            <div class="login-header">

                <h1>PokeStore</h1>

                <p>
                    Inicia sesión para continuar
                </p>

            </div>

            <form>

                <div class="form-group">

                    <label for="input-email">
                        Correo electrónico
                    </label>

                    <input id="input-email" type="email" placeholder="correo@ejemplo.com">

                </div>

                <div class="form-group">

                    <label for="input-password">
                        Contraseña
                    </label>

                    <input id="input-password" type="password" placeholder="Ingresa tu contraseña">

                </div>

                <div class="login-options">

                    <label class="remember">
                        <input type="checkbox">
                        Recordarme
                    </label>

                    <a href="#" class="forgot">
                        ¿Olvidaste tu contraseña?
                    </a>

                </div>

                <button id="btn-inicio-sesion" type="button">
                    INICIAR SESIÓN
                </button>

            </form>

            <div class="register">

                <p>
                    ¿No tienes una cuenta?
                    <a href="#">Regístrate</a>
                </p>

            </div>

        </section>

    </main>

    <script src="JS/inicio-sesion.js"></script>

</body>

</html>
