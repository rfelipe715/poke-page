<!doctype html>
<html lang="es" data-tema="claro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogo · PokéStore</title>
    <meta
      name="description"
      content="Catálogo completo de cartas Pokémon del Set Base: filtra por tipo, rareza y precio."
    />

    <link rel="stylesheet" href="CSS/base.css" />
    <link rel="stylesheet" href="CSS/componentes.css" />
    <link rel="stylesheet" href="CSS/layout.css" />

    <script>
      // Marca que hay JavaScript disponible (lo usa el revelado al hacer scroll)
      document.documentElement.classList.add("js");

      const temaGuardado = localStorage.getItem("pokestore:tema");
      document.documentElement.dataset.tema = temaGuardado
        ? JSON.parse(temaGuardado)
        : matchMedia("(prefers-color-scheme: dark)").matches
        ? "oscuro"
        : "claro";
    </script>

    <script defer src="JS/datos.js"></script>
    <script defer src="JS/comun.js"></script>
    <script defer src="JS/cuenta.js"></script>
    <script defer src="JS/carrito.js"></script>
    <script defer src="JS/catalogo.js"></script>
  </head>

  <body>
    <a class="saltar-al-contenido" href="#contenido">Saltar al contenido</a>

    <noscript>
      <p class="aviso-nojs">
        Esta tienda necesita JavaScript activado para mostrar el catálogo.
      </p>
    </noscript>

    <header data-cabecera></header>

    <section class="cabecera-pagina">
      <div class="contenedor">
        <nav class="migas" aria-label="Ruta de navegación">
          <a href="index.html">Inicio</a>
          <span>/</span>
          <span>Catálogo</span>
        </nav>

        <h1>Todas las cartas</h1>
        <p>
          El Set Base completo disponible en tienda. Combina los filtros para
          encontrar exactamente la carta que te falta.
        </p>
      </div>
    </section>

    <main id="contenido">
      <div class="contenedor disposicion-catalogo">
        <!-- ============ Filtros ============ -->
        <div class="telon" id="telon-filtros"></div>

        <aside class="filtros" id="panel-filtros" aria-label="Filtros del catálogo">
          <div class="filtros-cabeza">
            <h2>Filtros</h2>
            <button class="btn btn-fantasma btn-chico" id="limpiar-filtros">
              Limpiar
            </button>
            <button
              class="btn-icono"
              id="cerrar-filtros"
              aria-label="Cerrar filtros"
              data-icono="cerrar"
            ></button>
          </div>

          <div class="grupo-filtro">
            <h3>Tipo</h3>
            <div class="lista-opciones" id="opciones-tipo"></div>
          </div>

          <div class="grupo-filtro">
            <h3>Rareza</h3>
            <div class="lista-opciones" id="opciones-rareza"></div>
          </div>

          <div class="grupo-filtro rango-precio">
            <h3>Precio máximo</h3>
            <input
              type="range"
              id="precio-maximo"
              aria-label="Precio máximo"
            />
            <div class="rango-valores">
              <span>$0</span>
              <span id="valor-precio">$0</span>
            </div>
          </div>

          <div class="grupo-filtro">
            <h3>Otros</h3>
            <div class="lista-opciones">
              <label class="opcion">
                <input type="checkbox" id="filtro-ofertas" />
                Sólo con descuento
              </label>
              <label class="opcion">
                <input type="checkbox" id="filtro-favoritos" />
                Sólo mis favoritas
              </label>
            </div>
          </div>
        </aside>

        <!-- ============ Resultados ============ -->
        <div>
          <div class="herramientas">
            <div class="buscador" id="buscador-catalogo" data-icono-buscar>
              <input
                type="search"
                id="buscar-carta"
                placeholder="Buscar por nombre..."
                aria-label="Buscar carta por nombre"
              />
              <button
                class="limpiar-busqueda"
                id="limpiar-busqueda"
                aria-label="Borrar búsqueda"
                data-icono="cerrar"
              ></button>
            </div>

            <button class="btn btn-secundario btn-filtros-movil" id="abrir-filtros">
              Filtros
            </button>

            <div class="select-envoltorio">
              <label class="solo-lectores" for="orden">Ordenar por</label>
              <select id="orden">
                <option value="relevancia">Más relevantes</option>
                <option value="precio-asc">Precio: menor a mayor</option>
                <option value="precio-desc">Precio: mayor a menor</option>
                <option value="valoracion">Mejor valoradas</option>
                <option value="descuento">Mayor descuento</option>
                <option value="nombre">Nombre A-Z</option>
              </select>
              <span data-icono="chevron"></span>
            </div>
          </div>

          <div class="resumen-resultados">
            <span id="conteo-resultados"></span>
            <div class="filtros-activos" id="fichas-activas"></div>
          </div>

          <div class="grilla-cartas" id="grilla-catalogo"></div>

          <div class="pie-catalogo" id="pie-catalogo"></div>
        </div>
      </div>
    </main>

    <footer data-pie></footer>
  </body>
</html>
